<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Prakhar India</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
<style>
body { background: var(--gray-50); }
.auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 48px 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); }
.auth-card .lock { width: 64px; height: 64px; background: var(--blue-50); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 1.75rem; }
.auth-card h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
.auth-card .subtitle { text-align: center; color: var(--gray-500); font-size: 0.9rem; margin-bottom: 32px; }
.auth-card .form-group { margin-bottom: 20px; }
.auth-card .error-msg { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<section class="auth-wrapper">
  <div class="auth-card">
    <div class="lock">🔒</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Enter your credentials to access the admin panel.</p>
    <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Admin ID <span class="required">*</span></label>
        <input type="text" id="adminId" required placeholder="Enter admin ID" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="adminPass" required placeholder="Enter password" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">Login to Admin Panel</button>
    </form>
    <p style="text-align:center;margin-top:24px;font-size:0.85rem;color:var(--gray-500);">
      <a href="../index.html">← Back to Website</a>
    </p>
  </div>
</section>

<script>
const ADMIN_CREDENTIALS = {
  id: "admin",
  password: "admin@123"
};

function handleAdminLogin(e) {
  e.preventDefault();
  const id = document.getElementById('adminId').value.trim();
  const pass = document.getElementById('adminPass').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (id === ADMIN_CREDENTIALS.id && pass === ADMIN_CREDENTIALS.password) {
    localStorage.setItem('prakhar_admin_logged_in', 'true');
    localStorage.setItem('prakhar_admin_login_time', new Date().toISOString());
    const loginLog = JSON.parse(localStorage.getItem('prakhar_login_log') || '[]');
    loginLog.push({ type: 'admin', email: 'admin', name: 'Administrator', timestamp: new Date().toISOString() });
    localStorage.setItem('prakhar_login_log', JSON.stringify(loginLog));
    window.location.href = 'admin/dashboard.html';
  } else {
    errorMsg.style.display = 'block';
    setTimeout(() => errorMsg.style.display = 'none', 3000);
  }
}
</script>
</body>
</html>
